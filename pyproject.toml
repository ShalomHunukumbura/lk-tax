[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lk-tax"
version = "0.1.0"
description = "Sri Lankan tax rules as code: APIT, income tax, WHT, VAT and SSCL, effective-dated and sourced to the Inland Revenue Department."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shalom Hunukumbura" }]
keywords = ["sri lanka", "tax", "apit", "paye", "vat", "sscl", "withholding tax", "payroll"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Homepage = "https://github.com/ShalomHunukumbura/lk-tax"
Issues = "https://github.com/ShalomHunukumbura/lk-tax/issues"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/lk_tax"]

[tool.hatch.build.targets.sdist]
exclude = ["research/sources", "tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
