# Personal income tax for residents (and non-resident citizens), and the APIT
# monthly deduction from regular employment income, which is derived from it.
#
# Every version applies from `effective_from` until the next version starts.
# Money is in rupees; rates are fractions. Floats are parsed as exact Decimals.

[[versions]]
effective_from = 2023-01-01
note = "Regime introduced by Inland Revenue (Amendment) Act No. 45 of 2022."
personal_relief = 1_200_000
bands = [
    { size = 500_000, rate = 0.06 },
    { size = 500_000, rate = 0.12 },
    { size = 500_000, rate = 0.18 },
    { size = 500_000, rate = 0.24 },
    { size = 500_000, rate = 0.30 },
]
top_rate = 0.36
# Highest monthly income listed in APIT Tax Table No. 01. Above it the table
# says "Rs. 37,794 + 36% of the excess", i.e. the exact formula, unrounded.
apit_table_max_income = 309_150
sources = [
    { title = "APIT Tax Table No. 01 (2023/24 and 2024/25)", url = "https://www.ird.gov.lk/en/publications/APIT_Tax_Tables/2023-2024/Table%20-%201/02.%20APIT_2324_Table_01_Text.pdf" },
    { title = "IRD Tax Chart, Y/A 2024/25", url = "https://www.ird.gov.lk/en/publications/SitePages/tax_chart_2425.aspx?menuid=1404" },
]

[[versions]]
effective_from = 2025-04-01
note = "Inland Revenue (Amendment) Act No. 02 of 2025: relief raised to Rs. 1.8M, 12% band removed. Unchanged by Amendment Act No. 11 of 2026."
personal_relief = 1_800_000
bands = [
    { size = 1_000_000, rate = 0.06 },
    { size = 500_000, rate = 0.18 },
    { size = 500_000, rate = 0.24 },
    { size = 500_000, rate = 0.30 },
]
top_rate = 0.36
apit_table_max_income = 366_100
# The official table departs from its own formula in one place: just above the
# 18%/24% boundary it lists 275,001-275,006 -> Rs. 12,501, still using the 18%
# band, where the formula gives Rs. 12,502 for 275,005 and 275,006. Employers
# are told to deduct per the table, so the table amount is reproduced here.
apit_table_overrides = [{ income_from = 275_005, income_to = 275_006, tax = 12_501 }]
sources = [
    { title = "Notice PN/IT/2025-01: revision of income tax rates from 01.04.2025", url = "https://www.ird.gov.lk/en/Lists/Latest%20News%20%20Notices/Attachments/666/PN_IT_2025-01_26032025_E.pdf" },
    { title = "APIT Tax Table No. 01 (2025/26)", url = "https://www.ird.gov.lk/en/publications/APIT_Tax_Tables/2025-2026/Table%20-%201/02.%20APIT_2526_Table_01_Text.pdf" },
]
